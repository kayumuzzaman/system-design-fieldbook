<svg class="dg" viewBox="0 0 1040 492" role="img" aria-labelledby="map-t map-d">
<title id="map-t">A web system drawn as one diagram, with each region linked to the part of the book that explains it</title>
<desc id="map-d">A client looks up a name in DNS, then sends a request through a CDN and a load balancer to a group of services. The services read and write a cache, a database with replicas, and object storage, and hand slow work to a queue and workers. One service is opened up to show the classes inside it. Foundations, distributed systems, operations and security apply to every box.</desc>

